<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f5754">
<meta name="description" content="绣坊协同 · 绣品生产派单与工费结算，数据仅存本机浏览器">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>绣坊协同 · 绣品生产派单</title>
<style>
:root{
  --ink:#2f3b3a; --jade:#2f5754; --jade2:#3f6f69; --cinnabar:#9c3535; --gold:#b6873c;
  --paper:#f7f3ea; --line:#e6ddcb; --muted:#8a8172; --white:#fffdf8;
  --red:#c0392b; --amber:#c47f17; --green:#2e7d5b; --blue:#3b6fa8; --purple:#7356a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#ded7c7;background-image:radial-gradient(circle at 20% 10%,#efe8d8,transparent 60%),radial-gradient(circle at 80% 90%,#d8cdb8,transparent 55%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.phone{width:min(420px,100vw);height:min(880px,100vh);background:var(--paper);border-radius:26px;box-shadow:0 24px 70px rgba(40,35,25,.35),0 0 0 8px #2b2b2b,0 0 0 10px #4a4a4a;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(max-width:430px){.phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}}
.statusbar{height:26px;flex:none;background:var(--jade);color:#e9e2cf;font-size:11px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;letter-spacing:.4px}
.appbar{height:62px;flex:none;background:linear-gradient(135deg,var(--jade),var(--jade2));color:#fff8e8;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 2px 10px rgba(20,40,35,.18);z-index:2}
.appbar-title{font-size:17px;font-weight:700;letter-spacing:1px}
.appbar-sub{font-size:11px;opacity:.78;margin-top:2px}
.appbar-right{display:flex;gap:8px;align-items:center}
.iconbtn{position:relative;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff8e8;border-radius:18px;padding:6px 10px;font-size:12px;cursor:pointer;display:flex;gap:4px;align-items:center}
.iconbtn:active{transform:scale(.96)}
.dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#ff5b52;border:1.5px solid #fff}
.hidden{display:none!important}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 84px;scrollbar-width:thin}
main::-webkit-scrollbar{width:4px}main::-webkit-scrollbar-thumb{background:#c9bfa9;border-radius:4px}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:66px;background:var(--white);border-top:1px solid var(--line);display:flex;box-shadow:0 -3px 14px rgba(60,50,30,.07);z-index:3;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.tab .ic{font-size:19px;line-height:1;filter:grayscale(.65)}
.tab.on{color:var(--cinnabar);font-weight:700}
.tab.on .ic{filter:none;transform:translateY(-1px)}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(80,65,40,.05)}
.card.tight{padding:10px 12px}
.cardTitle{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.oid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);letter-spacing:.3px}
.name{font-size:15px;font-weight:700;margin:3px 0 5px}
.meta{font-size:12px;color:var(--muted);line-height:1.65}
.meta b{color:var(--ink);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-block;font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:700;white-space:nowrap}
.chip.gray{background:#eee9df;color:#7a7263}.chip.blue{background:#e6eefb;color:var(--blue)}
.chip.purple{background:#efe9fa;color:var(--purple)}.chip.teal{background:#e0f0ec;color:var(--jade)}
.chip.amber{background:#fdf0da;color:var(--amber)}.chip.red{background:#fbe6e2;color:var(--red)}
.chip.green{background:#e2f2e9;color:var(--green)}.chip.done{background:#eae7de;color:#6f6a5e}
.chip.outline{background:transparent;border:1px solid var(--line);color:var(--muted)}
.cd{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cd.over{color:var(--red)}.cd.warn{color:var(--cinnabar)}.cd.near{color:var(--amber)}.cd.ok{color:var(--muted)}
.cd.done{color:var(--green)}
.btn{border:0;border-radius:10px;background:var(--cinnabar);color:#fff8f0;font-size:13px;font-weight:700;padding:10px 14px;cursor:pointer;letter-spacing:.3px}
.btn:active{transform:scale(.98)}
.btn.block{display:block;width:100%;margin-top:14px;padding:12px}
.btn.ghost{background:#f3ecdd;color:var(--jade);border:1px solid var(--line)}
.btn.mini{padding:6px 10px;font-size:11.5px;border-radius:8px;background:#f3ecdd;color:var(--jade);border:1px solid var(--line);font-weight:600}
.btn.mini.pri{background:var(--jade);color:#fff;border-color:var(--jade)}
.btn.mini.danger{background:#fbe9e5;color:var(--red);border-color:#f0d3cc}
.btn.mini.gold{background:#f8eed8;color:#8a631f;border-color:#ecdcb8}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sec{font-size:12px;font-weight:800;color:var(--jade);letter-spacing:1px;margin:16px 2px 8px;display:flex;align-items:center;gap:6px}
.sec:before{content:"";width:3px;height:13px;background:var(--cinnabar);border-radius:2px}
.sec .num{font-weight:500;color:var(--muted);font-size:11px}
.foldhead{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px}
.foldhead .arw{display:inline-block;font-size:9px;color:var(--muted);transition:transform .18s}
.foldhead.open .arw{transform:rotate(90deg)}
.foldbody{overflow:hidden}
.foldbody.hide{display:none}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat .n{font-size:19px;font-weight:800;color:var(--cinnabar);line-height:1.2}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:3px}
.banner{border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:10px;border:1px solid}
.banner.warn{background:#fdf0da;border-color:#f0d9ab;color:#8a5a12}
.banner.red{background:#fbe6e2;border-color:#f0cdc5;color:#9c3535}
.banner.info{background:#e8f0ee;border-color:#cfe0db;color:var(--jade)}
.banner.green{background:#e6f3eb;border-color:#c9e4d3;color:var(--green)}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 10px;line-height:1.8}
.empty .e{font-size:28px;display:block;margin-bottom:6px;opacity:.6}
.tline{border-left:2px solid var(--line);margin-left:5px;padding-left:12px}
.titem{position:relative;font-size:11.5px;color:var(--muted);padding:0 0 10px;line-height:1.55}
.titem:before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid var(--paper)}
.titem b{color:var(--ink)}
.mask{position:absolute;inset:0;background:rgba(30,26,18,.45);z-index:10;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:86%;background:var(--paper);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);font-size:15px;color:var(--jade)}
.sheet-head button{border:0;background:#ece4d3;width:28px;height:28px;border-radius:50%;font-size:13px;color:var(--muted);cursor:pointer}
.sheet-body{overflow-y:auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom))}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--jade);margin-bottom:5px}
.field label em{color:var(--cinnabar);font-style:normal}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:10px;font-size:13.5px;color:var(--ink);font-family:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px #f0e3c6}
.field .invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px #f6d5ce!important;background:#fff8f6!important}
.field textarea{resize:vertical;line-height:1.6}
.field input[type=file]{padding:8px;font-size:12px}
.help{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.info{background:#eee7d7;border:1px dashed #d8c9a9;border-radius:10px;padding:10px;font-size:12px;line-height:1.7;color:#5c523f;margin-bottom:12px}
.info b{color:var(--cinnabar)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted);flex:none}.kv span:last-child{text-align:right;font-weight:600}
.logitem{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;font-size:11.5px;line-height:1.6}
.logitem .lh{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:10.5px}
.logitem .lh b{color:var(--jade)}
.logitem .ld{margin-top:3px;color:var(--ink)}
.logitem .lx{margin-top:4px;background:#f5efe2;border-radius:6px;padding:5px 7px;color:#7a6a4c;font-size:10.5px}
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters input,.filters select{flex:1;min-width:0;border:1px solid var(--line);background:var(--white);border-radius:8px;padding:8px;font-size:12px;font-family:inherit;color:var(--ink)}
.thumb{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolegrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.rolebtn{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.rolebtn .ri{font-size:22px;display:block;margin-bottom:5px}
.rolebtn.on{border-color:var(--cinnabar);background:#fdf1ec;color:var(--cinnabar)}
.notice{font-size:11px;color:var(--muted);line-height:1.7}
.divider{height:1px;background:var(--line);margin:12px 0}
.badge{font-size:10px;background:var(--cinnabar);color:#fff;border-radius:10px;padding:1px 6px;margin-left:4px}
.toast{position:absolute;top:104px;left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(38,45,42,.96);font-weight:600;color:#fff8e8;padding:10px 16px;border-radius:20px;font-size:12.5px;z-index:20;opacity:0;pointer-events:none;transition:.22s;max-width:88%;text-align:center;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#9c3535}
.foot{text-align:center;font-size:10.5px;color:#a99f8c;padding:8px 0 4px;line-height:1.7}
.tagline{display:inline-block;background:#f1ead9;border-radius:6px;padding:2px 6px;font-size:10.5px;color:#7a6a4c;margin:2px 4px 0 0}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span id="clock">--:--</span><span>绣坊协同 · 本地版</span><span>📶 &nbsp;🔋</span></div>
  <header class="appbar">
    <div><div class="appbar-title" id="barTitle">工作台</div><div class="appbar-sub" id="barSub"></div></div>
    <div class="appbar-right">
      <button class="iconbtn" data-act="openRole">👤 <span id="roleBadge">管理员</span></button>
      <button class="iconbtn" data-act="openRemind">🔔<i id="remindDot" class="dot hidden"></i></button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabbar" class="tabbar"></nav>
</div>
<div id="mask" class="mask hidden">
  <div class="sheet">
    <div class="sheet-head"><b id="sheetTitle"></b><button data-act="closeSheet">✕</button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';
/* ============================ 基础工具 ============================ */
var KEY='embroidery_app_v1';
var ROLE_NAME={admin:'管理员',tracker:'跟单员',embroiderer:'绣娘'};
var STATUS={
  pending_assign:{t:'待派单',c:'gray'},   assigned:{t:'待接单',c:'blue'},
  accepted:{t:'已接单·待发料',c:'blue'}, material_sent:{t:'已发料·待收料',c:'purple'},
  material_received:{t:'已收料·待领料',c:'purple'}, producing:{t:'生产中',c:'teal'},
  returned:{t:'已交回·待回收',c:'amber'}, recovered:{t:'已回收·待质检',c:'amber'},
  rework:{t:'返工中',c:'red'}, passed:{t:'质检通过·待结算',c:'green'}, settled:{t:'已结算',c:'done'}
};
var ACTION_NAME={accept:'接单',confirmMaterial:'确认领料',returnGoods:'交回登记'};
var db=null;
var ui={tab:'home',logQuery:'',logRole:'all',logOrder:'all',adminFilter:'all',flashId:'',userFold:true,orderFold:true,settleOpen:{}};
var sheetState={onSubmit:null,onChange:null,required:[]};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function nowISO(){return new Date().toISOString();}
function fmt(ts){var d=new Date(ts);if(isNaN(d.getTime()))return String(ts||'—');return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtFull(ts){var d=new Date(ts);if(isNaN(d.getTime()))return String(ts||'—');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function dtLocal(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function hoursLater(h){return dtLocal(new Date(Date.now()+h*3600000));}
function toCents(n){var v=Number(n);return isFinite(v)?Math.round(v*100):0;}
function yuan(c){return (Math.round(Number(c)||0)/100);}
function numVal(v,def){return (v===''||v==null)?def:(isFinite(Number(v))?Number(v):def);}
function money(n){var c=toCents(n),neg=c<0,a=Math.abs(c);return '¥'+(neg?'-':'')+Math.floor(a/100)+'.'+pad(a%100);}
function uid(p){db.seq.all=(db.seq.all||0)+1;return p+Date.now().toString(36).toUpperCase()+pad(db.seq.all%100);}
function assert(c,m){if(!c)throw new Error(m||'当前状态不允许此操作');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('本地空间不足，请到「留痕」导出数据后重置','err');}}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&d.orders){
    d.seq=d.seq||{all:0,order:1};d.settings=d.settings||{role:'admin',trackerId:'T01',embroidererId:'E01'};
    d.users=d.users||[];d.logs=d.logs||[];d.exceptions=d.exceptions||[];d.proxyOps=d.proxyOps||[];d.photos=d.photos||[];d.payments=d.payments||[];
    d.orders.forEach(function(o){o.history=o.history||[];o.qcRecords=o.qcRecords||[];o.pendingProxy=o.pendingProxy||[];});
    return d;
  }}}catch(e){}return null;
}
function toast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type==='err'?' err':'');clearTimeout(t._tm);t._tm=setTimeout(function(){t.className='toast';},2400);}
function $(s){return document.querySelector(s);}

function cd(iso){
  var ms=new Date(iso).getTime()-Date.now(),a=Math.abs(ms);
  var h=Math.floor(a/3600000),m=Math.floor(a%3600000/60000),s=Math.floor(a%60000/1000);
  var txt=(ms<0?'逾期 ':(h>=24?'剩余 ':'剩余 '))+(h>=24?Math.floor(h/24)+'天'+pad(h%24)+'时':(h?h+'时':'')+m+'分'+(h?'':s+'秒'));
  var lv=ms<0?'over':ms<24*3600000?'warn':ms<48*3600000?'near':'ok';
  return {text:txt,level:lv,ms:ms};
}
function cdHtml(iso,done){if(done)return '<span class="cd done">已完结</span>';var c=cd(iso);return '<span class="cd '+c.level+'" data-cd="'+esc(iso)+'">'+c.text+'</span>';}
function chip(st){var s=STATUS[st]||{t:st,c:'gray'};return '<span class="chip '+s.c+'">'+esc(s.t)+'</span>';}
function user(id){return db.users.find(function(u){return u.id===id;})||{id:id,name:'未指派',role:'embroiderer'};}
function uname(id){return id?user(id).name:'未指派';}
function findOrder(id){return db.orders.find(function(o){return o.id===id;});}
function activeOrders(){return db.orders.filter(function(o){return o.status!=='settled';});}
function myOrders(){return db.orders.filter(function(o){return o.assignedTo===db.settings.embroidererId;});}
function actor(){var r=db.settings.role,id=r==='admin'?'A01':(r==='tracker'?db.settings.trackerId:db.settings.embroidererId);var u=user(id);return {id:u.id,name:u.name,role:r};}
function addLog(action,orderId,detail,extra,who){var a=who||actor();db.logs.unshift({id:uid('L'),ts:nowISO(),action:action,orderId:orderId||'',detail:detail,role:a.role||db.settings.role,roleName:ROLE_NAME[a.role||db.settings.role]||'',actor:a.name,extra:extra||null});}
function step(o,action,detail,by){o.history=o.history||[];o.history.push({ts:nowISO(),action:action,detail:detail,by:by||actor().name});}
function paidFor(orderId){return yuan((db.payments||[]).filter(function(p){return p.orderId===orderId;}).reduce(function(s,p){return s+toCents(p.amount);},0));}
function wageOf(o){var due=o.settlement?yuan(toCents(o.settlement.amount)):0,paid=paidFor(o.id);return {due:due,paid:paid,left:yuan(Math.max(0,toCents(due)-toCents(paid)))};}
function wageSummary(embroidererId){
  var list=db.orders.filter(function(o){return o.status==='settled'&&o.assignedTo===embroidererId&&o.settlement;});
  var dueC=0,paidC=0;list.forEach(function(o){var w=wageOf(o);dueC+=toCents(w.due);paidC+=toCents(w.paid);});
  return {orders:list,due:yuan(dueC),paid:yuan(paidC),left:yuan(Math.max(0,dueC-paidC))};
}

/* ============================ 演示数据 ============================ */
function seed(){
  var d=new Date(),ymd=''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  var s={version:1,seq:{all:0,order:10},settings:{role:'admin',trackerId:'T01',embroidererId:'E01'},
    users:[
      {id:'A01',name:'沈总管',role:'admin'},
      {id:'T01',name:'小周',role:'tracker'},{id:'T02',name:'阿岚',role:'tracker'},
      {id:'E01',name:'苏绣娘',role:'embroiderer'},{id:'E02',name:'阿绣',role:'embroiderer'},{id:'E03',name:'林姐',role:'embroiderer'}
    ],orders:[],logs:[],exceptions:[],proxyOps:[],photos:[],payments:[]};
  function O(n,title,pattern,qty,needle,deadlineH,unit,material,assignedTo,status,extra){
    var id='XP'+ymd+pad(n);
    var o=Object.assign({id:id,title:title,pattern:pattern,qty:qty,needle:needle,deadline:hoursLater(deadlineH),unitPrice:unit,material:material,assignedTo:assignedTo||'',status:status,createdAt:nowISO(),history:[],qcRecords:[],reworkCount:0,pendingProxy:[],progress:0},extra||{});
    o.history.push({ts:nowISO(),action:'建单',detail:'绣品单创建 · '+title,by:'沈总管'});
    return o;

function deleteOrderFn(id){
  var o=findOrder(id);
  assert(o,'未找到该订单');
  assert(db.settings.role==='admin','仅管理员可删除订单');
  var pays=(db.payments||[]).filter(function(p){return p.orderId===id;});
  var excs=(db.exceptions||[]).filter(function(e){return e.orderId===id;});
  var pxs=(db.proxyOps||[]).filter(function(p){return p.orderId===id;});
  var phs=(db.photos||[]).filter(function(p){return p.orderId===id;});
  var paidAmt=pays.reduce(function(s,p){return s+toCents(p.amount);},0);
  var settled=(o.status==='settled');
  var links=[];
  if(pays.length)links.push('付款记录 '+pays.length+' 条（共 '+money(paidAmt)+'）');
  if(excs.length)links.push('异常 '+excs.length+' 条');
  if(pxs.length)links.push('代操作 '+pxs.length+' 条');
  if(phs.length)links.push('现场照片 '+phs.length+' 张');
  var msg='确定删除订单「'+o.title+'」（'+id+'）？\n当前状态：'+(STATUS[o.status]?STATUS[o.status].t:o.status)+'\n';
  if(links.length)msg+='将一并删除：'+links.join('、')+'\n';
  if(settled)msg+='\n⚠️ 该订单已结算且有工费数据，删除会同时清除结算与付款记录，请确认款项已核对无误！\n';
  msg+='\n此操作不可恢复，建议先在「留痕」导出 JSON 备份。';
  if(!confirm(msg))return;
  var delPxIds=pxs.map(function(p){return p.id;});
  db.orders=db.orders.filter(function(x){return x.id!==id;});
  db.payments=(db.payments||[]).filter(function(p){return p.orderId!==id;});
  db.exceptions=(db.exceptions||[]).filter(function(e){return e.orderId!==id;});
  db.proxyOps=(db.proxyOps||[]).filter(function(p){return p.orderId!==id;});
  db.photos=(db.photos||[]).filter(function(p){return p.orderId!==id;});
  db.logs=(db.logs||[]).filter(function(l){return l.orderId!==id;});
  db.orders.forEach(function(x){
    if(x.pendingProxy&&x.pendingProxy.length)x.pendingProxy=x.pendingProxy.filter(function(px){return delPxIds.indexOf(px)<0;});
  });
  addLog('删除订单','','管理员删除订单「'+o.title+'」（'+id+'，原状态：'+(STATUS[o.status]?STATUS[o.status].t:o.status)+'）'+(links.length?'；同时清除：'+links.join('、'):''));
  save();closeSheet();render();toast('已删除订单「'+o.title+'」');
}

    var oldAmt=yuan(toCents(o.settlement.amount));
    o.settlement={qty:qty,unitPrice:up,deduct:ded,bonus:bon,amount:amount,by:ctx.who.name,ts:nowISO(),note:d.note||'修正结算'};
    step(o,'修正结算','实发 '+money(oldAmt)+' → '+money(amount)+'（'+qty+'×'+money(up)+' -'+money(ded)+' +'+money(bon)+'）',ctx.who.name);
    addLog('修正结算',o.id,'实发 '+money(oldAmt)+' → '+money(amount)+'｜归属 '+uname(o.assignedTo),{oldAmount:oldAmt,amount:amount},ctx.who);
    return '已修正结算：'+money(oldAmt)+' → '+money(amount);
  },
  payWage:function(o,d,ctx){
    assert(o.status==='settled'&&o.settlement,'仅已结算的绣品可登记付款');
    var amt=yuan(toCents(d.amount));
    assert(amt>0,'付款金额必须大于 0');
    var w=wageOf(o),leftC=Math.max(0,toCents(w.left)-toCents(amt));
    assert(toCents(amt)<=toCents(w.left),'本次付款 '+money(amt)+' 超过未付余额 '+money(w.left));
    db.payments.unshift({id:uid('PY'),orderId:o.id,embroidererId:o.assignedTo,amount:amt,by:ctx.who.name,ts:nowISO(),note:d.note||''});
    step(o,'支付工费','支付 '+money(amt)+(d.note?'｜'+d.note:''),ctx.who.name);
    addLog('支付工费',o.id,'向 '+uname(o.assignedTo)+' 支付 '+money(amt)+'｜剩余未付 '+money(yuan(leftC))+(d.note?'｜'+d.note:''),{amount:amt,embroiderer:uname(o.assignedTo),left:yuan(leftC)},ctx.who);
    return '已支付 '+money(amt)+'，该单剩余未付 '+money(yuan(leftC));
  },
  urge:function(o,d,ctx){
    step(o,'催办提醒','管理员催办：'+(d.note||'请尽快处理'),ctx.who.name);
    addLog('催办提醒',o.id,'催办 '+(d.note||'请尽快处理')+'｜'+uname(o.assignedTo),null,ctx.who);
    return '催办提醒已留痕';
  }
};

function doBiz(name,o,d,ctx){
  ctx=ctx||{};
  ctx.who=ctx.who||actor();
  var msg=Biz[name](o,d,ctx);
  save();
  return msg;
}

/* ============================ 表单与弹层 ============================ */
function fieldHtml(f){
  var v=f.value==null?'':esc(String(f.value));
  var c='';
  if(f.type==='select'){
    c='<select name="'+f.name+'">'+(f.options||[]).map(function(o){return '<option value="'+esc(o.v)+'"'+(String(o.v)===String(f.value==null?'':f.value)?' selected':'')+'>'+esc(o.t)+'</option>';}).join('')+'</select>';
  }else if(f.type==='textarea'){
    c='<textarea name="'+f.name+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.ph||'')+'">'+v+'</textarea>';
  }else if(f.type==='info'){
    return '<div class="info"'+(f.id?' id="'+f.id+'"':'')+'>'+f.value+'</div>';
  }else if(f.type==='file'){
    c='<input type="file" name="'+f.name+'" accept="image/*" capture="environment">';
  }else{
    c='<input type="'+(f.type||'text')+'" name="'+f.name+'" value="'+v+'" placeholder="'+esc(f.ph||'')+'"'+(f.step?' step="'+f.step+'"':'')+(f.min!=null?' min="'+f.min+'"':'')+'>';
  }
  return '<div class="field"><label>'+esc(f.label)+(f.required?' <em>*</em>':'')+'</label>'+c+(f.help?'<div class="help">'+esc(f.help)+'</div>':'')+'</div>';
}
function openForm(title,fields,onSubmit,submitText,onChange){
  $('#sheetTitle').textContent=title;
  $('#sheetBody').innerHTML='<form id="sheetForm" novalidate>'+fields.map(fieldHtml).join('')+'<button class="btn block" type="submit">'+esc(submitText||'确认提交')+'</button></form>';
  sheetState.onSubmit=onSubmit;sheetState.onChange=onChange||null;
  sheetState.required=fields.filter(function(f){return f.required&&f.name;}).map(function(f){return {name:f.name,label:f.label};});
  $('#sheetBody').scrollTop=0;
  $('#mask').classList.remove('hidden');
  var t=$('#toast');t.className='toast';t.textContent='';
}
function openDetail(title,html){
  $('#sheetTitle').textContent=title;
  $('#sheetBody').innerHTML=html+'<button class="btn ghost block" data-act="closeSheet">关闭</button>';
  sheetState.onSubmit=null;sheetState.onChange=null;sheetState.required=[];
  $('#mask').classList.remove('hidden');
}
function closeSheet(){$('#mask').classList.add('hidden');sheetState.onSubmit=null;sheetState.onChange=null;sheetState.required=[];}
function optUsers(role){return db.users.filter(function(u){return u.role===role;}).map(function(u){return {v:u.id,t:u.name};});}
function optOrders(list){return list.map(function(o){return {v:o.id,t:o.id+' · '+o.title+'（'+STATUS[o.status].t+'）'};});}
function addUserFn(name,role){
  name=String(name||'').trim();assert(name,'请填写人员姓名');
  assert(['embroiderer','tracker','admin'].indexOf(role)>=0,'请选择正确角色');
  db.seq=db.seq||{all:0,order:1};db.seq.all=(Number(db.seq.all)||0)+1;
  var prefix=role==='embroiderer'?'E':(role==='tracker'?'T':'A');
  var id=prefix+Date.now().toString(36).toUpperCase()+pad(db.seq.all%100);
  db.users.push({id:id,name:name,role:role});
  addLog('人员管理','','新增'+ROLE_NAME[role]+' '+name+'（'+id+'）');
  save();return id;
}

/* 图片：本地压缩 / 模拟生成 */
function compressImage(file){
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){var img=new Image();img.onload=function(){
      var w=Math.min(480,img.width),h=Math.round(img.height*w/img.width);
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      try{res(c.toDataURL('image/jpeg',0.62));}catch(e){res(null);}
    };img.onerror=function(){res(null);};img.src=fr.result;};
    fr.onerror=function(){res(null);};fr.readAsDataURL(file);
  });
}
function genPhoto(o,note){
  var c=document.createElement('canvas');c.width=480;c.height=300;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,480,300);g.addColorStop(0,'#f3e7cf');g.addColorStop(1,'#d6bd94');x.fillStyle=g;x.fillRect(0,0,480,300);
  x.strokeStyle='#9c3535';x.lineWidth=5;x.beginPath();x.arc(240,128,84,0,Math.PI*2);x.stroke();
  x.strokeStyle='rgba(47,87,84,.75)';x.lineWidth=2;
  for(var i=0;i<10;i++){var a=i*Math.PI/5;x.beginPath();x.moveTo(240,128);x.quadraticCurveTo(240+Math.cos(a+.3)*70,128+Math.sin(a+.3)*70,240+Math.cos(a)*78,128+Math.sin(a)*78);x.stroke();}
  x.fillStyle='#b6873c';x.beginPath();x.arc(240,128,14,0,Math.PI*2);x.fill();
  x.fillStyle='rgba(255,253,246,.9)';x.fillRect(0,244,480,56);
  x.fillStyle='#3b2b20';x.font='bold 16px sans-serif';x.fillText('现场留痕 · '+(o?o.id:'—'),12,266);
  x.font='12px sans-serif';x.fillText(fmtFull(nowISO())+' · '+(note||'跟单员现场拍照').slice(0,26),12,288);
  try{return c.toDataURL('image/jpeg',0.72);}catch(e){return '';}
}

function reminders(){
  var r=db.settings.role,a=[];
  if(r==='admin'){
    db.orders.filter(function(o){return o.status==='accepted';}).forEach(function(o){a.push('📦 待扫码放料：'+o.title+' · '+uname(o.assignedTo));});
    db.proxyOps.filter(function(p){return p.status==='pending_review';}).forEach(function(p){a.push('🤝 代操作待复核：'+p.operator+' 代 '+uname(p.belongTo)+'「'+ACTION_NAME[p.action]+'」');});
    db.exceptions.filter(function(e){return e.status==='待处理';}).forEach(function(e){a.push('⚠️ 待处理异常：'+e.type+' · '+e.orderId);});
    var unpaid=db.orders.filter(function(o){return o.status==='settled'&&wageOf(o).left>0.001;});
    if(unpaid.length)a.push('💰 待付工费：'+unpaid.length+' 单，合计 '+money(yuan(unpaid.reduce(function(s,o){return s+toCents(wageOf(o).left);},0))));
    activeOrders().filter(function(o){return cd(o.deadline).ms<0;}).forEach(function(o){a.push('⏰ 逾期：'+o.title+'（'+cd(o.deadline).text+'）');});
  }else if(r==='tracker'){
    db.orders.filter(function(o){return o.status==='assigned'||o.status==='accepted';}).forEach(function(o){a.push('📦 待扫码放料：'+o.title+' · '+uname(o.assignedTo));});
    db.orders.filter(function(o){return o.status==='material_sent';}).forEach(function(o){a.push('📥 待扫码收料：'+o.title+' · '+o.id);});
    db.proxyOps.filter(function(p){return p.status==='pending_review';}).forEach(function(p){a.push('🤝 代操作待复核：'+p.orderId+'（归属 '+uname(p.belongTo)+'）');});
  }else{
    myOrders().forEach(function(o){
      if(o.status==='assigned')a.push('📋 待接单：'+o.title+' · 交期 '+fmt(o.deadline));
      if(o.status==='material_received')a.push('🧵 待确认领料：'+o.title);
      if(o.status==='rework')a.push('↩️ 返工中：'+o.title+'，请查看缺陷点');
      if(o.status!=='settled'&&cd(o.deadline).ms<24*3600000)a.push('⏰ '+o.title+' '+cd(o.deadline).text+'，请优先安排');
    });
    myPendingProxy().forEach(function(p){a.push('🤝 有代操作待你复核：'+ACTION_NAME[p.action]+' · '+p.orderId);});
    var myLeft=wageSummary(db.settings.embroidererId).left;
    if(myLeft>0.001)a.push('💰 你有待支付工费 '+money(myLeft)+'，可在「果实」查看');
  }
  return a;
}

document.addEventListener('submit',function(e){

document.addEventListener('input',function(e){
  if(e.target.classList&&e.target.classList.contains('invalid')&&e.target.value)e.target.classList.remove('invalid');
  if(e.target.dataset.filter==='logQuery'){ui.logQuery=e.target.value;var l=$('#logList');if(l)l.innerHTML=logListHtml();}
});
document.addEventListener('change',function(e){
  if(e.target.classList&&e.target.classList.contains('invalid')&&e.target.value)e.target.classList.remove('invalid');
  if(e.target.id==='importFile'&&e.target.files&&e.target.files[0]){
    var file=e.target.files[0];e.target.value='';
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        assert(d&&d.orders&&Array.isArray(d.orders),'备份文件格式不正确');
        if(!confirm('导入将覆盖当前浏览器里的所有数据，确定继续？'))return;
        d.seq=d.seq||{all:0,order:1};d.settings=d.settings||{role:'admin',trackerId:'T01',embroidererId:'E01'};
        d.users=d.users||[];d.logs=d.logs||[];d.exceptions=d.exceptions||[];d.proxyOps=d.proxyOps||[];d.photos=d.photos||[];d.payments=d.payments||[];
        d.orders.forEach(function(o){o.history=o.history||[];o.qcRecords=o.qcRecords||[];o.pendingProxy=o.pendingProxy||[];});
        db=d;save();ui.tab=TABS[db.settings.role]?TABS[db.settings.role][0][0]:'home';render();
        toast('导入成功：共 '+db.orders.length+' 单');
      }catch(err){toast('导入失败：'+(err&&err.message||'文件无法解析'),'err');}
    };
    fr.readAsText(file);
  }
});
setInterval(function(){
  document.querySelectorAll('[data-cd]').forEach(function(el){var c=cd(el.dataset.cd);el.textContent=c.text;el.className='cd '+c.level;});
  var t=$('#clock');if(t){var d=new Date();t.textContent=pad(d.getHours())+':'+pad(d.getMinutes());}
},1000);

/* ============================ 启动 ============================ */
db=load()||seed();
try{
  if(localStorage.getItem('xiufang_reset_seed')==='1'){
    db=seed();save();localStorage.removeItem('xiufang_reset_seed');
    setTimeout(function(){toast('已恢复出厂演示数据');},300);
  }
}catch(e){}
if(!db.settings)db.settings={role:'admin',trackerId:'T01',embroidererId:'E01'};
ui.tab=TABS[db.settings.role]?TABS[db.settings.role][0][0]:'home';
save();render();
(function(){var d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());})();
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
